<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img">
  <title>Câblage Wi-Fi Radar : OLED, buzzer et capteur PIR sur l'ESP32</title>
  <rect width="1200" height="900" fill="#f4f1e8"/>

  <text x="600" y="44" text-anchor="middle" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#1a1f1c">Câblage Wi-Fi Radar v1.1</text>
  <text x="600" y="74" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#3e4a44">Kit ELEGOO ESP-32  ·  lisez les inscriptions sur chaque module</text>

  <!-- ESP32 board -->
  <g id="esp32">
    <rect x="450" y="150" width="300" height="400" rx="18" fill="#1c1c1c" stroke="#111" stroke-width="2"/>
    <rect x="545" y="138" width="110" height="22" rx="6" fill="#c8ccd0" stroke="#555" stroke-width="1.5"/>
    <text x="600" y="154" text-anchor="middle" font-family="DejaVu Sans" font-size="12" font-weight="700" fill="#222">USB-C</text>
    <text x="600" y="210" text-anchor="middle" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#f4f1e8">ESP32</text>
    <text x="600" y="236" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#b8c0b4">DevKit  ·  CP2102</text>

    <rect x="418" y="270" width="32" height="28" rx="3" fill="#d94a4a"/>
    <text x="540" y="291" text-anchor="end" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#f4f1e8">3V3</text>

    <rect x="418" y="330" width="32" height="28" rx="3" fill="#222"/>
    <text x="540" y="351" text-anchor="end" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#f4f1e8">GND</text>

    <rect x="418" y="400" width="32" height="28" rx="3" fill="#d94a4a"/>
    <text x="540" y="421" text-anchor="end" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#f4f1e8">5V / VIN</text>

    <text x="600" y="520" text-anchor="middle" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#8a938c">BOOT et RESET : ne pas y brancher les capteurs</text>

    <rect x="750" y="260" width="32" height="28" rx="3" fill="#3b7ddd"/>
    <text x="670" y="281" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#f4f1e8">21 SDA</text>

    <rect x="750" y="320" width="32" height="28" rx="3" fill="#c9a61a"/>
    <text x="670" y="341" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#f4f1e8">22 SCL</text>

    <rect x="750" y="400" width="32" height="28" rx="3" fill="#e07a2f"/>
    <text x="670" y="421" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#f4f1e8">25</text>

    <rect x="750" y="470" width="32" height="28" rx="3" fill="#3cb56e"/>
    <text x="670" y="491" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#f4f1e8">27</text>
  </g>

  <!-- OLED -->
  <g id="oled">
    <rect x="40" y="160" width="250" height="200" rx="12" fill="#0e1110" stroke="#333" stroke-width="2"/>
    <rect x="58" y="176" width="214" height="100" rx="6" fill="#0a1a14" stroke="#5ee8a0" stroke-width="2"/>
    <text x="165" y="224" text-anchor="middle" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#5ee8a0">oui</text>
    <text x="165" y="250" text-anchor="middle" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#9bb5a6">Présence</text>
    <g font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#f4f1e8">
      <rect x="52" y="288" width="52" height="56" rx="4" fill="#444"/>
      <text x="78" y="322" text-anchor="middle">GND</text>
      <rect x="108" y="288" width="52" height="56" rx="4" fill="#d94a4a"/>
      <text x="134" y="322" text-anchor="middle">VCC</text>
      <rect x="164" y="288" width="52" height="56" rx="4" fill="#c9a61a"/>
      <text x="190" y="322" text-anchor="middle">SCL</text>
      <rect x="220" y="288" width="52" height="56" rx="4" fill="#3b7ddd"/>
      <text x="246" y="322" text-anchor="middle">SDA</text>
    </g>
    <!-- Labels sit under the module, in the gap above the mid GND bus (y=540) -->
    <text x="165" y="390" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1a1f1c">Écran OLED 0,96 po</text>
    <text x="165" y="414" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#3e4a44">I2C  ·  adresse 0x3C</text>
    <text x="165" y="436" text-anchor="middle" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#6a4a12">L'ordre des broches peut changer.</text>
  </g>

  <!-- Buzzer -->
  <g id="buzzer">
    <rect x="70" y="620" width="210" height="150" rx="12" fill="#efe6c8" stroke="#8a7a40" stroke-width="2"/>
    <circle cx="180" cy="685" r="40" fill="#d8c888" stroke="#5a4a20" stroke-width="3"/>
    <circle cx="180" cy="685" r="16" fill="#c8b870" stroke="#5a4a20" stroke-width="2"/>
    <circle cx="100" cy="668" r="8" fill="#e07a2f"/>
    <text x="118" y="674" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1a1f1c">+</text>
    <circle cx="100" cy="712" r="8" fill="#222"/>
    <text x="118" y="718" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1a1f1c">−</text>
    <text x="175" y="798" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1a1f1c">Buzzer (actif ou passif)</text>
  </g>

  <!-- PIR: captions ABOVE the module so wires leaving the pins do not cross them -->
  <g id="pir">
    <text x="1045" y="200" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1a1f1c">Capteur PIR</text>
    <text x="1045" y="222" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#3e4a44">HC-SR501  ·  OUT à 3,3 V</text>
    <rect x="940" y="238" width="210" height="182" rx="12" fill="#1e3a28" stroke="#2d5a3c" stroke-width="2"/>
    <circle cx="1045" cy="322" r="54" fill="#f2f0e6" stroke="#c8c4b4" stroke-width="3"/>
    <ellipse cx="1045" cy="322" rx="38" ry="26" fill="none" stroke="#bbb" stroke-width="1.5"/>
    <text x="1045" y="398" text-anchor="middle" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#d8f0e0">lentille</text>
    <g font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#f4f1e8">
      <rect x="960" y="412" width="50" height="22" rx="3" fill="#d94a4a"/>
      <text x="985" y="428" text-anchor="middle">VCC</text>
      <rect x="1020" y="412" width="50" height="22" rx="3" fill="#3cb56e"/>
      <text x="1045" y="428" text-anchor="middle">OUT</text>
      <rect x="1080" y="412" width="50" height="22" rx="3" fill="#222"/>
      <text x="1105" y="428" text-anchor="middle">GND</text>
    </g>
  </g>

  <!-- Wires (drawn under labels that have cream backdrops) -->

  <!-- OLED SDA: out below the pin, then over the top -->
  <path d="M246 356 L280 356 L280 120 L860 120 L860 274 L782 274" fill="none" stroke="#3b7ddd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="300" y="98" width="160" height="22" rx="4" fill="#f4f1e8"/>
  <text x="308" y="114" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#1a4a9a">bleu : SDA → 21</text>

  <!-- OLED SCL: out below the pin, then over the top -->
  <path d="M190 356 L300 356 L300 100 L890 100 L890 334 L782 334" fill="none" stroke="#c9a61a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="620" y="78" width="180" height="22" rx="4" fill="#f4f1e8"/>
  <text x="628" y="94" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#6a5a08">jaune : SCL → 22</text>

  <!-- OLED VCC: leave sideways above the « Écran OLED » label, then to 3V3 -->
  <path d="M134 344 L134 352 L335 352 L335 284 L418 284" fill="none" stroke="#d94a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="200" y="460" width="170" height="22" rx="4" fill="#f4f1e8"/>
  <text x="207" y="476" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#9a2020">rouge : VCC → 3V3</text>

  <!-- GND tree: every module joins the ESP32 GND pin. Left rail x=20, mid bus y=540, bottom rail y=882. -->
  <!-- OLED GND goes left immediately (does not drop through the label), then down the left rail. -->
  <path d="M78 344 L20 344 L20 882 L1105 882 L1105 434" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 540 L310 540 L310 344 L418 344" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 712 L20 712" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="36" y="552" width="190" height="22" rx="4" fill="#f4f1e8"/>
  <text x="43" y="568" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#111">noir : GND commun</text>

  <!-- Junction dots at every GND join -->
  <circle cx="78" cy="344" r="6" fill="#111"/>
  <circle cx="20" cy="344" r="6" fill="#111"/>
  <circle cx="20" cy="540" r="6" fill="#111"/>
  <circle cx="20" cy="712" r="6" fill="#111"/>
  <circle cx="20" cy="882" r="6" fill="#111"/>
  <circle cx="310" cy="540" r="6" fill="#111"/>
  <circle cx="418" cy="344" r="6" fill="#111"/>
  <circle cx="100" cy="712" r="6" fill="#111"/>
  <circle cx="1105" cy="882" r="6" fill="#111"/>
  <circle cx="1105" cy="434" r="6" fill="#111"/>

  <!-- Buzzer + to GPIO25 -->
  <path d="M100 668 L30 668 L30 610 L910 610 L910 414 L782 414" fill="none" stroke="#e07a2f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="400" y="588" width="230" height="22" rx="4" fill="#f4f1e8"/>
  <text x="408" y="604" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#8a3a10">orange : buzzer + → 25</text>

  <!-- PIR VCC to 5V -->
  <path d="M985 434 L985 570 L340 570 L340 414 L418 414" fill="none" stroke="#d94a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="560" y="548" width="310" height="22" rx="4" fill="#f4f1e8"/>
  <text x="568" y="564" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#9a2020">rouge : PIR VCC → 5V (pas 3,3 V)</text>

  <!-- PIR OUT to GPIO27 -->
  <path d="M1045 434 L1045 530 L880 530 L880 484 L782 484" fill="none" stroke="#3cb56e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="888" y="538" width="150" height="22" rx="4" fill="#f4f1e8"/>
  <text x="896" y="554" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#1a6a38">vert : OUT → 27</text>

  <!-- Legend (above the bottom GND rail at y=882) -->
  <rect x="360" y="670" width="520" height="186" rx="12" fill="#fff" stroke="#c8c4b8" stroke-width="1.5"/>
  <text x="620" y="700" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1a1f1c">Rappel</text>
  <text x="385" y="732" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#1a1f1c">• Tous les GND vont ensemble (rail de masse).</text>
  <text x="385" y="760" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#1a1f1c">• L'écran va au 3,3 V. Le capteur PIR va au 5 V.</text>
  <text x="385" y="788" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#1a1f1c">• Ne mettez jamais 5 V sur une broche GPIO.</text>
  <text x="385" y="816" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#1a1f1c">• Évitez les broches 0, 2, 6 à 12 et 15.</text>
  <text x="385" y="844" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#1a1f1c">• Sans écran ou sans PIR, la carte démarre quand même.</text>
</svg>
